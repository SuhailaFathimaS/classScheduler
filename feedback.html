<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback — ClassFlow</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav class="nav container"><a class="brand" href="index.html"><span class="brand-mark">✦</span> ClassFlow</a><div class="nav-links"><a href="student.html">Student</a><a class="active" href="feedback.html">Feedback</a><a href="teacher-login.html">Teacher</a></div></nav>
<main class="container narrow-page">
  <div class="page-heading centered"><div><div class="eyebrow">YOUR VOICE MATTERS</div><h1>How was your class?</h1><p>A quick note helps your teacher improve the next session.</p></div></div>
  <div id="feedbackMessage" class="notice hidden"></div>
  <section class="panel feedback-panel">
    <form id="feedbackForm">
      <label>Student name<input id="fbName" required maxlength="80" placeholder="Your full name"></label>
      <label>Email (optional)<input id="fbEmail" type="email" maxlength="120" placeholder="you@example.com"></label>
      <label>Subject / class<input id="fbSubject" maxlength="100" placeholder="e.g. Physics"></label>
      <div><span class="field-label">Rating</span><div class="stars" id="stars">
        <button type="button" data-value="1">★</button><button type="button" data-value="2">★</button><button type="button" data-value="3">★</button><button type="button" data-value="4">★</button><button type="button" data-value="5">★</button>
      </div><input id="rating" type="hidden" value="0" required></div>
      <label>Feedback<textarea id="fbText" rows="6" required maxlength="1000" placeholder="Tell us what went well or what could be better..."></textarea></label>
      <button class="btn btn-primary btn-full" type="submit" id="feedbackBtn">Send feedback <span>→</span></button>
    </form>
  </section>
</main>
<script src="js/config.js"></script><script src="js/api.js"></script><script src="js/feedback.js"></script>
</body></html>
